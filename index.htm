<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Cloud DB SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* LOGIN PAGE STYLING */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #0f172a;
        }

        .login-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background-color: #0369a1;
        }

        /* MAIN APP DASHBOARD STYLING */
        #appScreen {
            display: none; /* Inajificha mpaka Admin aingie */
            flex-direction: row;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            width: 100%;
            text-align: left;
        }

        .nav-btn.active {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-info h3 {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
        }

        .card-info p {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .card-icon {
            font-size: 1.8rem;
            color: #0284c7;
            background: #e0f2fe;
            padding: 12px;
            border-radius: 10px;
        }

        /* Content Box */
        .content-box {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 32px;
        }

        .content-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background-color: #0284c7; color: #fff; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-secondary { background-color: #64748b; color: #fff; }

        .btn-action {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-edit { background-color: #fef08a; color: #854d0e; }
        .btn-delete { background-color: #fecaca; color: #991b1b; }

        /* Table */
        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .badge {
            background-color: #dcfce7;
            color: #15803d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            #appScreen { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 1. ADMIN LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Admin Portal</h2>
            <p>Ingia kusimamia mfumo wa wanafunzi</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Barua Pepe (Email)</label>
                    <input type="email" id="loginEmail" placeholder="admin@school.com" required>
                </div>
                <div class="input-group">
                    <label>Neno la Siri (Password)</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Ingia (Login)</button>
            </form>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD APP SCREEN -->
    <div id="appScreen">
        <div class="sidebar">
            <div>
                <h2><i class="fa-solid fa-graduation-cap"></i> SMS Portal</h2>
                <button class="nav-btn active"><i class="fa-solid fa-users"></i> Dashboard & Students</button>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Toka (Logout)</button>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Dashboard ya Mfumo</h1>
                <span style="font-size:0.9rem; color:#64748b;">Hali ya Database: <strong id="dbStatus" style="color:#16a34a;">LocalStorage / Online Sync</strong></span>
            </div>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="card">
                    <div class="card-info">
                        <h3>Jumla ya Wanafunzi</h3>
                        <p id="totalStudents">0</p>
                    </div>
                    <div class="card-icon"><i class="fa-solid fa-user-graduate"></i></div>
                </div>
                <div class="card">
                    <div class="card-info">
                        <h3>Form 1 & 2</h3>
                        <p id="juniorStudents">0</p>
                    </div>
                    <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
                </div>
                <div class="card">
                    <div class="card-info">
                        <h3>Form 3 & 4</h3>
                        <p id="seniorStudents">0</p>
                    </div>
                    <div class="card-icon"><i class="fa-solid fa-award"></i></div>
                </div>
            </div>

            <!-- Add / Edit Form -->
            <div class="content-box">
                <h3 id="formTitle">Sajili Mwanafunzi Mpya</h3>
                <form id="studentForm" style="margin-top: 15px;">
                    <input type="hidden" id="studentId">
                    <div class="form-grid">
                        <input type="text" id="fullName" placeholder="Jina Kamili (e.g. Amina Juma)" required>
                        <input type="email" id="email" placeholder="Barua Pepe" required>
                        <select id="studentClass" required>
                            <option value="">Chagua Darasa</option>
                            <option value="Form 1">Form 1</option>
                            <option value="Form 2">Form 2</option>
                            <option value="Form 3">Form 3</option>
                            <option value="Form 4">Form 4</option>
                        </select>
                    </div>
                    <div class="btn-container">
                        <button type="submit" id="submitBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Hifadhi Mwanafunzi</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;" onclick="resetForm()">Ghairi (Cancel)</button>
                    </div>
                </form>
            </div>

            <!-- Student Directory & Download Report -->
            <div class="content-box">
                <div class="content-box-header">
                    <h3>Orodha ya Wanafunzi</h3>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="searchInput" placeholder="Tafuta mwanafunzi..." onkeyup="filterStudents()" style="width:200px;">
                        <!-- DOWNLOAD REPORT BUTTON -->
                        <button class="btn btn-success" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> Pakua Ripoti (CSV)</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Jina</th>
                                <th>Barua Pepe</th>
                                <th>Darasa</th>
                                <th>Status</th>
                                <th>Kitendo</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* --- SUPABASE DATABASE SETUP (Cloud DB) --- */
        // Weka URL na ANON KEY kutoka akaunti yako ya Supabase (supabase.com) hapa:
        const SUPABASE_URL = ""; 
        const SUPABASE_ANON_KEY = ""; 
        let supabase = null;

        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            document.getElementById('dbStatus').textContent = "Supabase Cloud DB (Online)";
        }

        /* --- 1. LOGIN SYSTEM --- */
        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.getElementById('appScreen');

        // Angalia kama Admin alikuwa tayari ameingia
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            showDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Simple Admin Verification (Inaweza kuunganishwa na Supabase Auth pia)
            if (email === "admin@school.com" && password === "admin123") {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                alert("Email au Password siyo sahihi! (Tumia: admin@school.com / admin123)");
            }
        });

        function showDashboard() {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            renderTable();
        }

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }

        /* --- 2. DATA MANAGEMENT (CRUD) --- */
        const initialStudents = [
            { id: "ST001", name: "Amina Juma", email: "amina@gmail.com", studentClass: "Form 4" },
            { id: "ST002", name: "Baraka John", email: "baraka@gmail.com", studentClass: "Form 2" },
            { id: "ST003", name: "Charles Kelvin", email: "charles@gmail.com", studentClass: "Form 3" }
        ];

        function getStudents() {
            const stored = localStorage.getItem('sms_students');
            if (!stored) {
                localStorage.setItem('sms_students', JSON.stringify(initialStudents));
                return initialStudents;
            }
            return JSON.parse(stored);
        }

        async function saveStudents(students) {
            localStorage.setItem('sms_students', JSON.stringify(students));
            
            // Sync na Cloud Database kama ipo configured
            if (supabase) {
                await supabase.from('students').upsert(students);
            }
            renderTable();
        }

        function renderTable(data = null) {
            const students = data || getStudents();
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = '';

            if (students.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">Hakuna kumbukumbu za wanafunzi.</td></tr>`;
            } else {
                students.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>#${s.id}</td>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.email}</td>
                        <td>${s.studentClass}</td>
                        <td><span class="badge">Active</span></td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editStudent('${s.id}')"><i class="fa-solid fa-pen"></i> Badili</button>
                            <button class="btn-action btn-delete" onclick="deleteStudent('${s.id}')"><i class="fa-solid fa-trash"></i> Futa</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            updateStats();
        }

        function updateStats() {
            const students = getStudents();
            document.getElementById('totalStudents').textContent = students.length;
            document.getElementById('juniorStudents').textContent = students.filter(s => s.studentClass === 'Form 1' || s.studentClass === 'Form 2').length;
            document.getElementById('seniorStudents').textContent = students.filter(s => s.studentClass === 'Form 3' || s.studentClass === 'Form 4').length;
        }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const studentClass = document.getElementById('studentClass').value;

            let students = getStudents();

            if (id) {
                students = students.map(s => s.id === id ? { id, name, email, studentClass } : s);
            } else {
                const newId = 'ST' + String(Date.now()).slice(-3);
                students.push({ id: newId, name, email, studentClass });
            }

            saveStudents(students);
            resetForm();
        });

        function editStudent(id) {
            const s = getStudents().find(item => item.id === id);
            if (s) {
                document.getElementById('studentId').value = s.id;
                document.getElementById('fullName').value = s.name;
                document.getElementById('email').value = s.email;
                document.getElementById('studentClass').value = s.studentClass;
                document.getElementById('formTitle').textContent = `Badilisha Taarifa (${s.id})`;
                document.getElementById('cancelBtn').style.display = 'inline-flex';
            }
        }

        function deleteStudent(id) {
            if (confirm(`Je, una uhakika unataka kumfuta mwanafunzi #${id}?`)) {
                let students = getStudents().filter(s => s.id !== id);
                saveStudents(students);
            }
        }

        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('formTitle').textContent = 'Sajili Mwanafunzi Mpya';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function filterStudents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = getStudents().filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.email.toLowerCase().includes(query) || 
                s.studentClass.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        /* --- 3. DOWNLOAD REPORT (EXPORT TO CSV) --- */
        function exportToCSV() {
            const students = getStudents();
            if (students.length === 0) {
                alert("Hakuna data ya ku-export!");
                return;
            }

            let csv = "ID,Jina,Barua Pepe,Darasa,Hali\n";
            students.forEach(s => {
                csv += `"${s.id}","${s.name}","${s.email}","${s.studentClass}","Active"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Ripoti_ya_Wanafunzi.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
