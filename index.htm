<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mfumo wa Wanafunzi (SMS)</title>
    <!-- Tailwind CSS kwa ajili ya muonekano bora -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<bg class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Mfumo wa Wanafunzi</h1>
            <div class="space-x-2">
                <button onclick="switchView('addStudentView')" class="bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded text-sm font-semibold">
                    + Ongeza Mwanafunzi
                </button>
                <button onclick="switchView('viewStudents')" class="bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded text-sm font-semibold">
                    Orodha ya Wanafunzi
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        
        <!-- SEHEMU YA 1: FOMU YA KUONGEZA / KUREKEBISHA MWANAFUNZI -->
        <section id="addStudentView" class="bg-white p-6 rounded-lg shadow-md max-w-xl mx-auto mb-8">
            <h2 id="formTitle" class="text-2xl font-bold mb-4 text-gray-700">Sajili Mwanafunzi Mpya</h2>
            
            <form id="studentForm" class="space-y-4">
                <!-- ID iliyofichwa kwa ajili ya Uhariri (Edit) -->
                <input type="hidden" id="studentId">

                <!-- Jina Buled -->
                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700">Jina Kamili</label>
                    <input type="text" id="fullName" required placeholder="Mf. Juma Hamisi"
                           class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Jinsia -->
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700">Jinsia</label>
                    <select id="gender" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">-- Chagua Jinsia --</option>
                        <option value="Mvulana">Mvulana</option>
                        <option value="Msichana">Msichana</option>
                    </select>
                </div>

                <!-- Barua Pepe (Email) -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Barua Pepe (Email)</label>
                    <input type="email" id="email" required placeholder="mwanafunzi@example.com"
                           class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Darasa -->
                <div>
                    <label for="studentClass" class="block text-sm font-medium text-gray-700">Darasa</label>
                    <select id="studentClass" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">-- Chagua Darasa --</option>
                        <option value="Form 1">Form 1</option>
                        <option value="Form 2">Form 2</option>
                        <option value="Form 3">Form 3</option>
                        <option value="Form 4">Form 4</option>
                        <option value="Form 5">Form 5</option>
                        <option value="Form 6">Form 6</option>
                    </select>
                </div>

                <!-- Vifungo vya Fomu -->
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="resetForm()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-md">
                        Safisha Fomu
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md">
                        Hifadhi Mwanafunzi
                    </button>
                </div>
            </form>
        </section>

        <!-- SEHEMU YA 2: ORODHA YA WANAFUNZI -->
        <section id="viewStudents" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-2xl font-bold mb-4 text-gray-700">Orodha ya Wanafunzi Waliosajiliwa</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 uppercase text-xs">
                            <th class="p-3">ID</th>
                            <th class="p-3">Jina Kamili</th>
                            <th class="p-3">Jinsia</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Darasa</th>
                            <th class="p-3 text-center">Vitendo</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Data za Wanafunzi zitaingia hapa kupitia JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // --- CONFIGURATION YA SUPABASE ---
        const SUPABASE_URL = "WEKA_SUPABASE_URL_YAKO_HAPA";
        const SUPABASE_KEY = "WEKA_SUPABASE_ANON_KEY_YAKO_HAPA";
        
        let supabaseClient = null;
        if (SUPABASE_URL !== "WEKA_SUPABASE_URL_YAKO_HAPA") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // --- HELPER FUNCTIONS ---
        
        // SWITCH VIEWS
        function switchView(viewId) {
            document.getElementById('addStudentView').classList.add('hidden');
            document.getElementById('viewStudents').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        // RESET FORM
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('formTitle').innerText = 'Sajili Mwanafunzi Mpya';
        }

        // GENERATE AUTOMATIC ID (Mf. STD-001)
        function generateNextFormattedId(students) {
            const nextNum = students.length + 1;
            return `STD-${String(nextNum).padStart(3, '0')}`;
        }

        // FETCH STUDENTS
        async function getStudents() {
            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('students').select('*');
                if (!error && data) return data;
            }
            return JSON.parse(localStorage.getItem('sms_students') || '[]');
        }

        // RENDER STUDENTS TABLE
        async function loadAndRenderStudents() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">Inapakia data...</td></tr>';
            
            const students = await getStudents();
            
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">Hakuna wanafunzi waliosajiliwa.</td></tr>';
                return;
            }

            tbody.innerHTML = students.map(s => `
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="p-3 font-semibold text-blue-600">${s.id}</td>
                    <td class="p-3">${s.name || ''}</td>
                    <td class="p-3">${s.gender || ''}</td>
                    <td class="p-3">${s.email || ''}</td>
                    <td class="p-3">${s.studentclass || s.studentClass || s.student_class || ''}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editStudent('${s.id}')" class="text-blue-600 hover:underline">Hariri</button>
                    </td>
                </tr>
            `).join('');
        }

        // EDIT STUDENT
        async function editStudent(id) {
            const students = await getStudents();
            const student = students.find(s => s.id === id);
            
            if (student) {
                document.getElementById('studentId').value = student.id;
                document.getElementById('fullName').value = student.name || '';
                document.getElementById('gender').value = student.gender || '';
                document.getElementById('email').value = student.email || '';
                document.getElementById('studentClass').value = student.studentclass || student.studentClass || student.student_class || '';
                
                document.getElementById('formTitle').innerText = `Rekebisha Mwanafunzi #${student.id}`;
                switchView('addStudentView');
            }
        }

        // --- EVENT LISTENER YA FORM SUBMISSION ---
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const idInput = document.getElementById('studentId').value;
            const name = document.getElementById('fullName').value.trim();
            const gender = document.getElementById('gender').value;
            const email = document.getElementById('email').value.trim();
            const studentClass = document.getElementById('studentClass').value;

            let students = await getStudents();
            const finalId = idInput || generateNextFormattedId(students);

            // Payload inayotuma majina yote matatu ya column ili kuzuia Supabase Not-Null Errors
            let studentPayload = { 
                id: finalId, 
                name: name, 
                gender: gender, 
                email: email, 
                studentclass: studentClass, 
                studentClass: studentClass, 
                student_class: studentClass 
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('students').upsert([studentPayload]);
                
                if (error) {
                    alert("Hitilafu ya Supabase: " + error.message);
                    console.error("Supabase Add Error:", error);
                    return;
                }
            }

            // Backup kwenye LocalStorage
            let localData = JSON.parse(localStorage.getItem('sms_students') || '[]');
            const existingIndex = localData.findIndex(s => s.id === finalId);
            if (existingIndex > -1) {
                localData[existingIndex] = studentPayload;
            } else {
                localData.push(studentPayload);
            }
            localStorage.setItem('sms_students', JSON.stringify(localData));

            resetForm();
            alert(`Mwanafunzi #${finalId} amesajiliwa kikamilifu!`);
            await loadAndRenderStudents();
            switchView('viewStudents');
        });

        // Pakia data mwanzo unapofungua ukurasa
        window.addEventListener('DOMContentLoaded', () => {
            loadAndRenderStudents();
        });
    </script>
</body>
</html>
